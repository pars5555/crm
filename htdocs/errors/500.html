<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong &middot; CRM</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            color: #1b2430; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
            background: radial-gradient(900px 500px at 15% -10%, rgba(220,38,38,.12), transparent 60%), #eef2f8;
        }
        .card { width: 100%; max-width: 460px; background: #fff; border-radius: 16px; padding: 40px 34px 34px; text-align: center;
                box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 20px 50px rgba(16,24,40,.12); }
        .code { font-size: 64px; font-weight: 800; letter-spacing: -2px; line-height: 1; color: #dc2626; }
        h1 { font-size: 22px; margin: 14px 0 8px; }
        p { color: #6a7686; line-height: 1.5; margin-bottom: 26px; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        a, button { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; padding: 11px 20px; border-radius: 10px; text-decoration: none; cursor: pointer; }
        .primary { background: #2f6fed; color: #fff; border: 1px solid #2f6fed; }
        .primary:hover { background: #2459cc; }
        .ghost { background: #fff; color: #364152; border: 1px solid #cfd6e2; }
        .ghost:hover { background: #f1f4f9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">500</div>
        <h1>Something went wrong</h1>
        <p>This page hit an unexpected problem. The error has been logged. Please try again in a moment; if it keeps happening, tell the administrator which page you were on.</p>
        <div class="actions">
            <button class="primary" type="button" onclick="location.reload()">Try again</button>
            <a class="ghost" href="/">Back to the dashboard</a>
        </div>
    </div>
</body>
</html>
